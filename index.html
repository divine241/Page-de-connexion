<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Page de connexion moderne, responsive et simple en HTML, CSS et JavaScript.">
  <title>Connexion</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="login-card" aria-labelledby="login-title">
      <header class="card-header">
        <h1 id="login-title">Connexion</h1>
        <p class="card-subtitle">Connectez-vous pour accéder à votre espace</p>
      </header>

      <form id="login-form" novalidate autocomplete="on">
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            inputmode="email"
            placeholder="exemple@email.com"
            autocomplete="email"
            required
          >
          <p class="error-message" id="email-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <div class="password-wrapper">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Votre mot de passe"
              autocomplete="current-password"
              required
            >
            <button
              class="password-toggle"
              id="password-toggle"
              type="button"
              aria-label="Afficher le mot de passe"
              aria-pressed="false"
            >
              Afficher
            </button>
          </div>
          <p class="error-message" id="password-error" aria-live="polite"></p>
        </div>

        <button class="submit-btn" type="submit">Se connecter</button>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
